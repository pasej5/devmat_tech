<style>
  /* ==================== NAVBAR BASE STYLES ==================== */
  nav.navbar.main-navbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    width: 100vw;
    margin: 0;
    padding: 20px 0;
    background: rgba(0, 0, 0, 0.8);
    z-index: 9999;
    backdrop-filter: blur(6px);
    box-sizing: border-box;
    transition: all 0.3s ease;
  }

  nav.navbar.main-navbar .container-fluid {
    max-width: 100%;
    width: 100%;
    padding: 0 40px;
    margin: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
  }

  /* ==================== BRAND / LOGO ==================== */
  nav.navbar.main-navbar .navbar-brand {
    color: #fff;
    font-weight: bold;
    font-size: 1.5rem;
    text-decoration: none;
    display: flex;
    align-items: center;
  }

  nav.navbar.main-navbar .navbar-brand:hover {
    color: #fff;
    text-decoration: none;
  }

  nav.navbar.main-navbar .navbar-brand img {
    margin-right: 10px;
  }

  /* ==================== NAV ITEMS (DESKTOP) ==================== */
  nav.navbar.main-navbar .navbar-nav {
    display: flex;
    align-items: center;
    gap: 5px;
    margin: 0;
    padding: 0;
    list-style: none;
  }

  nav.navbar.main-navbar .navbar-nav .nav-item {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  nav.navbar.main-navbar .navbar-nav .nav-link {
    color: #fff;
    font-weight: 500;
    font-size: 15px;
    text-decoration: none;
    padding: 10px 15px;
    transition: color 0.3s ease;
    display: block;
  }

  nav.navbar.main-navbar .navbar-nav .nav-link:hover,
  nav.navbar.main-navbar .navbar-nav .nav-link:focus,
  nav.navbar.main-navbar .navbar-nav .nav-link.active {
    color: #5bc0de;
    text-decoration: none;
  }

  /* ==================== CONTACT BUTTON ==================== */
  nav.navbar.main-navbar .btn-contact {
    background: #5bc0de;
    color: #fff;
    padding: 10px 25px;
    border-radius: 5px;
    text-decoration: none;
    font-weight: 500;
    margin-left: 10px;
    transition: background 0.3s ease;
    display: inline-block;
  }

  nav.navbar.main-navbar .btn-contact:hover {
    background: #46b8da;
    color: #fff;
  }

  /* ==================== MOBILE TOGGLE BUTTON ==================== */
  nav.navbar.main-navbar .navbar-toggler {
    display: none;
    border: 2px solid rgba(255, 255, 255, 0.7);
    padding: 8px 12px;
    background: transparent;
    cursor: pointer;
    border-radius: 5px;
  }

  nav.navbar.main-navbar .navbar-toggler:focus {
    outline: none;
    box-shadow: none;
  }

  nav.navbar.main-navbar .navbar-toggler-icon {
    display: block;
    width: 25px;
    height: 20px;
    background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3e%3cpath stroke='rgba%28255, 255, 255, 1%29' stroke-linecap='round' stroke-miterlimit='10' stroke-width='2' d='M4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3e");
    background-repeat: no-repeat;
    background-position: center;
    background-size: contain;
  }

  /* ==================== COLLAPSE CONTAINER ==================== */
  nav.navbar.main-navbar .navbar-collapse {
    display: flex;
    justify-content: flex-end;
    align-items: center;
  }

  /* ==================== SHRINK ON SCROLL ==================== */
  nav.navbar.main-navbar.shrink {
    padding: 10px 0;
    background: rgba(0, 0, 0, 0.95);
  }

  /* ==================== TABLET STYLES (max-width: 992px) ==================== */
  @media screen and (max-width: 992px) {
    nav.navbar.main-navbar .container-fluid {
      padding: 0 20px;
    }

    nav.navbar.main-navbar .navbar-toggler {
      display: block;
    }

    nav.navbar.main-navbar .navbar-collapse {
      display: none;
      width: 100%;
      flex-basis: 100%;
      flex-direction: column;
      align-items: flex-start;
      background: rgba(0, 0, 0, 0.95);
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      padding: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    nav.navbar.main-navbar .navbar-collapse.show {
      display: flex;
    }

    nav.navbar.main-navbar .navbar-nav {
      flex-direction: column;
      align-items: flex-start;
      width: 100%;
      gap: 0;
    }

    nav.navbar.main-navbar .navbar-nav .nav-item {
      width: 100%;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    nav.navbar.main-navbar .navbar-nav .nav-item:last-child {
      border-bottom: none;
    }

    nav.navbar.main-navbar .navbar-nav .nav-link {
      padding: 15px 10px;
      width: 100%;
    }

    nav.navbar.main-navbar .btn-contact {
      margin-left: 0;
      margin-top: 15px;
      width: 100%;
      text-align: center;
      padding: 15px 25px;
    }
  }

  /* ==================== MOBILE STYLES (max-width: 576px) ==================== */
  @media screen and (max-width: 576px) {
    nav.navbar.main-navbar {
      padding: 15px 0;
    }

    nav.navbar.main-navbar .container-fluid {
      padding: 0 15px;
    }

    nav.navbar.main-navbar .navbar-brand {
      font-size: 1.2rem;
    }

    nav.navbar.main-navbar .navbar-brand img {
      height: 30px;
    }

    nav.navbar.main-navbar .navbar-nav .nav-link {
      font-size: 14px;
      padding: 12px 10px;
    }

    nav.navbar.main-navbar .btn-contact {
      font-size: 14px;
      padding: 12px 20px;
    }
  }
</style>

<nav class="navbar navbar-expand-lg main-navbar" id="mainNavbar">
  <div class="container-fluid">
    <a class="navbar-brand" href="{% url 'index' %}">
      <img src="{% static 'images/weblogo.png' %}" alt="JMatsika" height="40" />
      JMatsika
    </a>

    <button
      class="navbar-toggler"
      type="button"
      onclick="toggleMobileMenu()"
      aria-controls="navbarNav"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="navbar-collapse" id="navbarNav">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link" href="{% url 'index' %}">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'about' %}">Who we are</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'services' %}">What we do</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">What we think</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'careers' %}">Careers</a>
        </li>
        <li class="nav-item">
          <a class="btn btn-contact" href="#contact">Contact Us</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<script>
  // Mobile menu toggle
  function toggleMobileMenu() {
    const navbarCollapse = document.getElementById('navbarNav');
    navbarCollapse.classList.toggle('show');
  }

  // Close mobile menu when clicking on a link
  document
    .querySelectorAll('.navbar-nav .nav-link, .navbar-nav .btn-contact')
    .forEach((link) => {
      link.addEventListener('click', () => {
        const navbarCollapse = document.getElementById('navbarNav');
        navbarCollapse.classList.remove('show');
      });
    });

  // Shrink navbar on scroll
  window.addEventListener('scroll', function () {
    const navbar = document.getElementById('mainNavbar');
    if (window.scrollY > 50) {
      navbar.classList.add('shrink');
    } else {
      navbar.classList.remove('shrink');
    }
  });

  // Close mobile menu when clicking outside
  document.addEventListener('click', function (event) {
    const navbar = document.getElementById('mainNavbar');
    const navbarCollapse = document.getElementById('navbarNav');
    const toggler = document.querySelector('.navbar-toggler');

    if (!navbar.contains(event.target)) {
      navbarCollapse.classList.remove('show');
    }
  });
</script>
